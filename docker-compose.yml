services:
  nova:
    image: ghcr.io/l8tenever/nova-xr:latest
    pull_policy: always
    ports:
      - "${NOVA_PORT:-8080}:8080"
    environment:
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
