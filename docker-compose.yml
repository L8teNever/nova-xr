services:
  nova:
    image: ghcr.io/l8tenever/nova-xr-app:latest
    pull_policy: always
    ports:
      - "${NOVA_PORT:-8080}:8080"
    environment:
      UPLOAD_TOKEN: ${UPLOAD_TOKEN:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      MAX_MODELS: ${MAX_MODELS:-50}
      NOVA_MODELS_DIR: /data/models
    volumes:
      - nova-models:/data/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  nova-models:
